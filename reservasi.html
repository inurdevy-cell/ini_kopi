<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Reservasi Cafe Inur Chintya</title>

    <style>

            background-color: #c9a47a; /* WARNA COKLAT */

        }

            margin-bottom: 10px;
        }

        .menu-icons img {
            width: 80px;
            height: 70px;
            margin: 0 20px;
            display: inline-block;
        }

        hr {
            margin-top: 15px;
            border: 1px solid #8c6748;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            font-size: 18px;
        }

        td {
            padding: 10px 5px;
        }

        input[type=text],
        input[type=date],
        textarea {
            width: 250px;
            height: 25px;
            padding: 4px;
        }

        textarea {
            height: 40px;
            width: 380px;
        }

        .btn {
            padding: 6px 15px;
            font-size: 15px;

        }

<body>
<ul>
<h1>SELAMAT DATANG DI CAFE KOPI INUR CHINTYA</h1>

                    <input type="radio" name="area"> Outdoor (Smoking)

            <tr>
